[package]
name = "predictify-hybrid"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.7.6", features = [] }

[dev-dependencies]
soroban-sdk = { version = "21.7.6", features = ["testutils"] }

# Release profiles live in the workspace root (../Cargo.toml): Cargo ignores
# `[profile.*]` sections declared in a workspace member.
